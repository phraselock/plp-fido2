<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIDO2 – Register</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 40px;
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    h1 {
      font-size: 1.4rem;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #444;
      margin-bottom: 4px;
      margin-top: 16px;
    }

    input[type="text"], input[type="email"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #333;
      background: #fafafa;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="email"]:focus {
      border-color: #4a6cf7;
      background: #fff;
    }

    button {
      margin-top: 28px;
      width: 100%;
      padding: 12px;
      background: #4a6cf7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover  { background: #3a5ce0; }
    button:active { background: #2a4cd0; }
    button:disabled { background: #aaa; cursor: default; }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .status.success { background: #e6f9ee; color: #1a7a40; border: 1px solid #b7eacf; display: block; }
    .status.error   { background: #fff0f0; color: #c0392b; border: 1px solid #f5c6c6; display: block; }
    .status.info    { background: #eef2ff; color: #3a5ce0; border: 1px solid #c5d0fa; display: block; }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: #aaa;
    }

    .footer a { color: #4a6cf7; text-decoration: none; }

    .logo {
      position: absolute;
      top: 16px;
      right: 16px;
      max-height: 48px;
      max-width: 160px;
      object-fit: contain;
      border-radius: 8px;
    }

    .copyright {
      margin: 16px auto 40px auto;
      text-align: center;
      font-size: 11px;
      color: #aaa;
    }
  </style>
</head>
<body>
<div class="card">
  <img src="img/logo.png" alt="Logo" class="logo">
  <h1>Create your passkey</h1>
  <p class="subtitle">Register with FIDO2 — no password required.</p>

  <label for="displayname">Display name</label>
  <input type="text" id="displayname" placeholder="Jane Doe" value="Jane Doe">

  <label for="username">Username / E-mail</label>
  <input type="email" id="username" placeholder="jane.doe@example.com" value="">

  <label for="token">Registration token</label>
  <input type="text" id="token" placeholder="XXXXXXXX" maxlength="8"
         style="text-transform:uppercase;letter-spacing:3px;font-family:monospace;font-size:1.1rem;">

  <button id="btn" onclick="doRegister()">Register with passkey</button>

  <div id="status" class="status"></div>

  <p class="footer">Already registered? <a href="login.html">Sign in</a></p>
</div>
<p class="copyright">© 2026 iPoxo IT GmbH — All rights reserved</p>

<script>
  // ── Configuration ────────────────────────────────────────────────────────────
  const API_BASE = '/webauthn';   // adjust to match your nginx location
  // ─────────────────────────────────────────────────────────────────────────────

  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + type;
  }

  function base64urlToBytes(b64) {
    b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
    const pad = b64.length % 4;
    if (pad) b64 += '='.repeat(4 - pad);
    const bin = atob(b64);
    return Uint8Array.from(bin, c => c.charCodeAt(0));
  }

  function bytesToBase64url(buf) {
    return btoa(String.fromCharCode(...new Uint8Array(buf)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  async function doRegister() {
    const btn = document.getElementById('btn');
    btn.disabled = true;
    setStatus('Contacting server…', 'info');

    try {
      const params = {
        displayname: document.getElementById('displayname').value.trim(),
        user:        document.getElementById('username').value.trim(),
        rpid:        window.location.hostname,
        device:      navigator.userAgent,
        token:       document.getElementById('token').value.trim().toUpperCase()
      };

      const startRes = await fetch(API_BASE + '/register/start', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(params)
      });
      if (!startRes.ok) throw new Error('Server error: ' + startRes.status);

      const publicKey = await startRes.json();
      publicKey.challenge = base64urlToBytes(publicKey.challenge);
      publicKey.user.id   = base64urlToBytes(publicKey.user.id);

      setStatus('Waiting for authenticator…', 'info');
      const cred = await navigator.credentials.create({ publicKey });

      const result = {
        id:   cred.id,
        rawId: bytesToBase64url(cred.rawId),
        type: cred.type,
        response: {
          attestationObject: bytesToBase64url(cred.response.attestationObject),
          clientDataJSON:    bytesToBase64url(cred.response.clientDataJSON)
        }
      };

      const finishRes = await fetch(API_BASE + '/register/finish', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(result)
      });

      const msg = await finishRes.text();
      setStatus(finishRes.ok ? '✓ ' + msg : '✗ ' + msg, finishRes.ok ? 'success' : 'error');

    } catch (err) {
      setStatus('✗ ' + err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
